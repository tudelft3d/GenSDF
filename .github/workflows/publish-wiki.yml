name: Publish documentation to Wiki

on:
  push:
    branches:
      - main
      - v2.0
    paths:
      - docs/GenSDF.md
      - .github/workflows/publish-wiki.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out wiki and publish Home.md
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$WIKI_TOKEN" ]; then
            echo "::error::Configure the WIKI_TOKEN repository secret with wiki write access."
            exit 1
          fi

          wiki_dir="$(mktemp -d)"
          trap 'rm -rf "$wiki_dir"' EXIT
          git clone "https://x-access-token:${WIKI_TOKEN}@github.com/${REPOSITORY}.wiki.git" "$wiki_dir"
          cp docs/GenSDF.md "$wiki_dir/Home.md"

          cd "$wiki_dir"
          git add Home.md
          if git diff --cached --quiet -- Home.md; then
            echo "Wiki Home.md is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish GenSDF documentation"
          git push
